# =============================================================================
# configs/case_replays.yaml
#
# Documented real manipulation cases, written as scripts the simulator can
# replay (src/core/agents/manipulation/replay.py). They are a HELD-OUT test:
# the adversarial strategist never sees them and no detector trains on them.
# Scripts are stylised from public descriptions, not reconstructed order logs:
#   - sizes are in this simulator's units (multiples of average visible level
#     depth, or a target share of the visible near-touch depth on one side);
#   - time is in ticks (1 tick = 1 second, the simulator's finest step), so
#     sub-second behaviour (Coscia's millisecond cancels) becomes 1 tick;
#   - `verified` lists what the cited sources state; `approximated` lists what
#     had to be assumed to make the pattern executable.
#
# Script fields
#   label            persona used as ground truth (spoofing | layering)
#   markets          simulated commodities to replay in (the real case's own
#                    contract when it is one of ours, else a stand-in)
#   duration_ticks   length of the replayed episode
#   fake.side        buy | sell | both (both: direction per cycle, see persistence)
#   fake.n_orders    non-bona-fide orders per cycle, one price level apart
#   fake.levels_from_touch  first order this many ticks behind the same-side best price
#   fake.size_x_level_depth   size of EACH order x average visible level depth, or
#   fake.target_share         total fake orders as this share of visible near-touch depth
#   fake.lifetime_ticks [lo, hi]  rest before cancelling
#   fake.reprice     keep the orders at their distance as the touch moves
#   fake.cancel_on_genuine_fill  pull them as soon as the genuine order fills
#   fake.direction_persistence   chance the next cycle keeps the fake side (side: both)
#   genuine.place    per_cycle | none   genuine order at the touch on the other side
#   genuine.size_x_level_depth   its size x average level depth
#   genuine.rate     extra chance per tick, while fake orders rest, of another genuine order
#   flip_after_cancel  chance of trading aggressively the genuine way right after the pull
#   gap_ticks [lo, hi] idle time between cycles
#   n_accounts       >= 2: genuine and fake legs come from different accounts
# =============================================================================

sarao_layering_algorithm:
  title: "Navinder Sarao, E-mini S&P 500 layering algorithm (2010-2015)"
  label: layering
  markets: [crude_oil_wti, gold]       # E-mini is not simulated; liquid stand-ins
  duration_ticks: 1200
  fake:
    side: sell
    n_orders: 5
    levels_from_touch: 3
    target_share: 0.25
    lifetime_ticks: [240, 600]
    reprice: true
    cancel_on_genuine_fill: false
  genuine:
    place: none
    size_x_level_depth: 0.4
    rate: 0.03
  flip_after_cancel: 0.0
  gap_ticks: [5, 30]
  n_accounts: 1
  sources:
    - "CFTC Release 7156-15 (21 Apr 2015): https://www.cftc.gov/PressRoom/PressReleases/7156-15"
    - "CNBC, Sarao flash crash orders: https://www.cnbc.com/id/102607337"
  verified:
    - "modified trading platform placed several large SELL orders one price level apart"
    - "orders repriced as the market moved to stay at least 3-4 levels above the best ask"
    - "most orders cancelled without executing; used on 400+ trading days"
    - "on 6 May 2010 the orders were about 20-29% of the sell-side order book"
  approximated:
    - "target_share 0.25 of the visible near-touch sell depth stands for the 20-29% figure"
    - "orders rest 4-10 minutes per cycle (in reality the algorithm ran for hours)"
    - "his genuine trading is modelled as occasional small buys at the touch"

coscia_panther:
  title: "Michael Coscia / Panther Energy Trading, CME and ICE futures (2011)"
  label: spoofing
  markets: [copper, gold, crude_oil_wti]
  duration_ticks: 600
  fake:
    side: both
    direction_persistence: 0.0          # each cycle reverses (buy small / sell large, then the reverse)
    n_orders: 3
    levels_from_touch: 0
    size_x_level_depth: 3.0
    lifetime_ticks: [1, 1]
    reprice: false
    cancel_on_genuine_fill: true
  genuine:
    place: per_cycle
    size_x_level_depth: 0.3
    rate: 0.0
  flip_after_cancel: 0.0
  gap_ticks: [1, 4]
  n_accounts: 1
  sources:
    - "United States v. Coscia, 866 F.3d 782 (7th Cir. 2017); docket No. 16-3017"
    - "Cleary Gottlieb summary: https://www.clearygottlieb.com/news-and-insights/publication-listing/seventh-circuit-upholds-first-ever-federal-spoofing-conviction-8-10-17"
  verified:
    - "a small order on one side, then large orders on the opposite side"
    - "algorithm configured so the large orders would not all fill and were cancelled automatically after a short interval (milliseconds)"
  approximated:
    - "millisecond lifetimes become 1 tick (1 second), the simulator's finest step"
    - "3 large orders near the touch at 3x level depth each; direction reverses every cycle"

oystacher_3red:
  title: "Igor Oystacher / 3Red Trading, copper, crude oil, natural gas and others (2011-2014)"
  label: spoofing
  markets: [copper, crude_oil_wti, natural_gas]
  duration_ticks: 600
  fake:
    side: both
    direction_persistence: 0.7
    n_orders: 2
    levels_from_touch: 0
    size_x_level_depth: 4.0
    lifetime_ticks: [2, 6]
    reprice: false
    cancel_on_genuine_fill: false
  genuine:
    place: none
    size_x_level_depth: 0.5
    rate: 0.0
  flip_after_cancel: 0.8
  gap_ticks: [2, 10]
  n_accounts: 1
  sources:
    - "CFTC Release 7264-15 (19 Oct 2015): https://www.cftc.gov/PressRoom/PressReleases/7264-15"
    - "CFTC complaint: https://cftc.gov/idc/groups/public/%40lrenforcementactions/documents/legalpleading/enfigorcomplnt101915.pdf"
  verified:
    - "spoofing on at least 51 trading days, Dec 2011 - Jan 2014, in five futures (E-mini, copper, crude oil, natural gas, VIX) on four exchanges"
    - "created the appearance of false market depth"
  approximated:
    - "UNVERIFIED: the 'flip' (cancel the false depth, then trade aggressively the other way) is the commonly reported pattern, not confirmed from the primary text here"
    - "2 large orders at the touch at 4x level depth for 2-6 seconds"

jpmorgan_precious_metals:
  title: "JPMorgan precious metals desk (Smith, Nowak and others), COMEX gold and silver (2008-2016)"
  label: spoofing
  markets: [gold, silver]
  duration_ticks: 900
  fake:
    side: both
    direction_persistence: 0.9
    n_orders: 2
    levels_from_touch: 1
    size_x_level_depth: 5.0
    lifetime_ticks: [3, 15]
    reprice: false
    cancel_on_genuine_fill: true
  genuine:
    place: per_cycle
    size_x_level_depth: 1.0
    rate: 0.0
  flip_after_cancel: 0.0
  gap_ticks: [3, 20]
  n_accounts: 2
  sources:
    - "CFTC Release 8260-20 (29 Sep 2020): https://www.cftc.gov/PressRoom/PressReleases/8260-20"
    - "DOJ, traders convicted (2022): https://www.justice.gov/archives/opa/pr/former-jp-morgan-traders-convicted-fraud-attempted-price-manipulation-and-spoofing-multi-year"
  verified:
    - "orders placed with intent to cancel before execution, to move prices toward orders they intended to execute on the opposite side"
    - "gold, silver, platinum and palladium futures on NYMEX and COMEX, about May 2008 - Aug 2016; several traders on one desk"
  approximated:
    - "genuine orders of about one level of depth (bank-sized) at the touch"
    - "fake orders pulled when the genuine order fills or after 3-15 seconds; mostly one direction per stretch"
    - "two accounts (several traders on one desk); UNVERIFIED: iceberg genuine orders are not modelled"

