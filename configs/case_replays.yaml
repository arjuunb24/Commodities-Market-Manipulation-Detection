optiver_banging_the_close:
  title: "Optiver, NYMEX crude oil, heating oil and gasoline futures (March 2007): banging the close"
  label: pump_and_dump
  markets: [crude_oil_wti, natural_gas]   # heating oil and gasoline are not simulated
  duration_ticks: 660
  mode: program
  phases:
    - {name: before_close, kind: trade, ticks: 240, side: buy, how: marketable, size_x_level_depth: 0.6, rate: 0.1}
    - {name: closing_window, kind: trade, ticks: 180, side: buy, how: marketable, size_x_level_depth: 0.6, rate: 0.4}
    - {name: offset, kind: trade, ticks: 240, side: sell, how: passive, size_x_level_depth: 0.6, rate: 0.4}
  n_accounts: 1
  sources:
    - "CFTC Release 5521-08 (24 Jul 2008): https://www.cftc.gov/PressRoom/PressReleases/5521-08"
    - "CFTC Release 6239-12 (consent order, Apr 2012): https://www.cftc.gov/PressRoom/PressReleases/6239-12"
  verified:
    - "19 attempted manipulations over 11 days in March 2007 in NYMEX crude oil, heating oil and gasoline futures; at least five successful"
    - "banging the close: a substantial position acquired leading up to the closing period, about 20-30% of the trades just before the close and the remainder during it"
    - "settled in 2012: 13 million dollar civil penalty and 1 million dollar disgorgement"
  approximated:
    - "the simulator has no settlement; the close is a 3-minute window inside the session"
    - "trading direction (buying) and the passive offset afterwards are assumptions; the sources state the timing split, not the side"
    - "closest of the four personas is pump_and_dump (price pushed by concentrated aggressive trading); banging the close is not one of them"

shinhan_wash_trades:
  title: "Shinhan Securities (2025) and Aralia/Vintage (2021): wash trades between accounts of one owner"
  label: wash_trading
  markets: [gold, crude_oil_wti]
  duration_ticks: 600
  mode: program
  phases:
    - {name: offsetting_orders, kind: cross, ticks: 600, size_x_level_depth: 0.5, rate: 1.0, cross_delay_ticks: [0, 3]}
  n_accounts: 2
  sources:
    - "CFTC order, Shinhan Securities (17 Sep 2025): https://www.cftc.gov/media/12701/enfShinhanSecuritiesCoLtdAdministrativeOrder091725/download"
    - "CFTC order, Aralia/Vintage (27 Dec 2021): https://cftc.gov/media/6871/enfaraliaorder122721/download"
  verified:
    - "Shinhan: a trader executed 127 wash trades across Shinhan accounts, placing offsetting orders within seconds, knowing they would fill against each other"
    - "Aralia/Vintage: accounts with the same ultimate beneficial owner placed offsetting orders in the same futures product"
  approximated:
    - "trades compressed into a 10-minute episode (the real trades were spread over a longer period)"
    - "each wash: one account rests an order inside the spread, the other takes it 0-3 seconds later whenever the spread is wider than one tick; roles alternate"

amaranth_closing_range:
  title: "Amaranth Advisors (Brian Hunter), NYMEX natural gas futures (2006): selling into the closing range"
  label: pump_and_dump
  markets: [natural_gas, crude_oil_wti]
  duration_ticks: 1500
  mode: program
  phases:
    - {name: build_long_during_day, kind: trade, ticks: 900, side: buy, how: passive, size_x_level_depth: 0.5, rate: 0.08}
    - {name: closing_range_selling, kind: trade, ticks: 600, side: sell, how: marketable, size_x_level_depth: 0.8, rate: 0.35}
  n_accounts: 1
  sources:
    - "CFTC complaint (July 2007) and consent order (2009, 7.5 million dollars); Risk.net: https://www.risk.net/regulation/1502734/amaranth-civil-lawsuit-battle"
    - "SteelEye summary: https://www.steel-eye.com/news/amaranth-advisors-cftc-fine-manipulation"
  verified:
    - "attempted manipulation of NYMEX natural gas futures settlement prices on expiry days (24 Feb and 26 Apr 2006)"
    - "futures shorts reversed to long holdings during the trading day, then large volumes sold in the closing range (2:00-2:30 pm), whose volume-weighted price sets the settlement"
    - "the motive: large short natural gas swaps on ICE that settle on the NYMEX settlement price"
  approximated:
    - "the 30-minute closing range is compressed to 10 minutes; the simulator has no settlement or swap leg"
    - "daytime buying is passive at the bid, closing selling is marketable; sizes in level-depth units"
    - "closest of the four personas is pump_and_dump (price pushed by concentrated aggressive trading); here the push is downward"

moore_banging_the_close:
  title: "Moore Capital (Christopher Pia), NYMEX platinum and palladium futures (2007-2008): banging the close upward"
  label: pump_and_dump
  markets: [silver, gold]                 # platinum and palladium are not simulated; precious-metal stand-ins
  duration_ticks: 600
  mode: program
  phases:
    - {name: closing_period_buying, kind: trade, ticks: 300, side: buy, how: marketable, size_x_level_depth: 0.5, rate: 0.4}
    - {name: offset_after_close, kind: trade, ticks: 300, side: sell, how: passive, size_x_level_depth: 0.5, rate: 0.35}
  n_accounts: 1
  sources:
    - "CFTC Release 5815-10 (29 Apr 2010): https://www.cftc.gov/PressRoom/PressReleases/5815-10"
    - "CFTC Release 6079-11 (Pia, 2011): https://www.cftc.gov/PressRoom/PressReleases/6079-11"
  verified:
    - "a portfolio manager attempted to manipulate platinum and palladium settlement prices on NYMEX by banging the close, about Nov 2007 - May 2008"
    - "25 million dollars and a two-year restriction on closing-period trading for the firm; Pia 1 million dollars and a permanent ban from closing-period trading"
  approximated:
    - "buying direction follows the 'push settlement prices up' finding; sizes and a 5-minute closing window are assumptions"
    - "the passive offset after the close is an assumption (the sources do not say how positions were unwound)"

cargill_position_transfers:
  title: "Cargill de Mexico, CBOT corn, soybean and wheat futures (2010-2014): wash sales between its own accounts"
  label: wash_trading
  markets: [corn, wheat]
  duration_ticks: 600
  mode: program
  phases:
    - {name: equal_and_opposite_orders, kind: cross, ticks: 600, size_x_level_depth: 2.0, rate: 0.2, cross_delay_ticks: [0, 0]}
  n_accounts: 2
  sources:
    - "CFTC Release 7241-15 (24 Sep 2015): https://www.cftc.gov/PressRoom/PressReleases/7241-15"
    - "CFTC order: https://cftc.gov/idc/groups/public/%40lrenforcementactions/documents/legalpleading/enfcargillorder92415.pdf"
  verified:
    - "wash sales and non-competitive transactions in CBOT corn, soybean and wheat and KCBT hard red wheat futures, March 2010 - August 2014; 500,000 dollar penalty"
    - "equal and opposite orders for two accounts it owned, matching product, quantity, price and timing, to move hedge positions between accounts"
  approximated:
    - "fewer, larger crosses than the Shinhan script (position transfers, 2x level depth), entered in the same second; compressed into 10 minutes"
    - "like every cross here, only when the spread is wider than one tick (otherwise the orders would fill against others)"

