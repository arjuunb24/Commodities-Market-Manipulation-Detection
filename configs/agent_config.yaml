simulation:
  n_ticks: 10000
  ticks_per_bar: 100
  fundamental_value_initial: 100.0
  fundamental_value_drift: 0.0001
  fundamental_value_vol: 0.002
agents:
  noise_trader:
    count: 20
    arrival_rate_lambda: 0.6
    order_size_min: 1
    order_size_max: 50
    price_offset_ticks: 5.0
  momentum_trader:
    count: 8
    arrival_rate_lambda: 0.3
    lookback_ticks: 20
    momentum_threshold: 0.002
    order_size_base: 30
    order_size_scale: 5.0
  mean_reversion_trader:
    count: 6
    arrival_rate_lambda: 0.25
    reversion_threshold: 0.01
    order_size_base: 40
  market_maker:
    count: 1
    arrival_rate_lambda: 0.95
    spread_ticks: 1.0
    inventory_skew_factor: 0.1
    max_inventory: 500
    order_size: 20
