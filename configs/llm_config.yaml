# =============================================================================
# configs/llm_config.yaml — Module 4 (LLM & Agentic Intelligence Layer)
#
# PROVIDER SWITCH: every LLM call in the project goes to ONE provider.
#   active_provider below, or the env var LLM_PROVIDER (wins if set) = cerebras | gemini
#   cerebras → only CEREBRAS_API_KEY is used. gemini → the Gemini key pool.
# Values written as {gemini: x, cerebras: y} differ per provider.
# =============================================================================

active_provider: cerebras

providers:
  cerebras:
    model: "gpt-oss-120b"
    temperature: 0.2
    reasoning_effort: "low"     # gpt-oss bills its reasoning as output tokens; keep it short
    cache_responses: true       # identical requests are answered from data/llm_cache, never re-billed
  gemini:
    model: "gemini-3.6-flash"
    temperature: 1.0
    cache_responses: true

# --- Paid-credit guard (Cerebras only) ---------------------------------------
# Before every call the worst case (estimated input + max_tokens output) must fit
# in the remaining budget, otherwise no request is sent. Spend is persisted across
# runs in ledger_file. Delete/edit the ledger only if you top up credit.
cerebras_budget:
  budget_usd: 4.50                 # hard stop, leaves headroom under the $5 credit
  input_usd_per_million: 0.35      # gpt-oss-120b pricing
  output_usd_per_million: 0.75
  max_calls_per_process: 60        # a whole pipeline run uses ~1-3 calls per round
  min_seconds_between_calls: 6.0   # stays under the account's requests-per-minute limit
  ledger_file: "data/llm_cache/cerebras_spend.json"

# --- 4A: Narrative generator (one call per button click; 1 retry on grounding failure)
narrative_generator:
  max_tokens: {gemini: 2048, cerebras: 700}   # 4-6 sentence mechanism note
  max_retries: 1
  timeout_seconds: 45

# --- 4B: Adversarial strategist (once per round)
adversarial_strategist:
  max_tokens: {gemini: 4096, cerebras: 4000}   # 2500 was cut off mid-reasoning twice in one round (finish_reason=length)
  reasoning_effort: {cerebras: "medium"}  # the one place deeper thinking pays off (~$0.002-0.004/round)
  max_tool_calls: 5              # model turns per round (4 personas; gpt-oss sometimes proposes one per turn)
  explore_candidates: 2          # code exploration candidates probed per persona (random, larger jumps; never repeated)
  explore_candidates_stalled: 3  # ... when the search stalled (last round caught >= 90%, no candidate < 85%)
  max_retries: 1
  timeout_seconds: 60

# --- 4C: Analyst assistant (per chat message)
analyst_assistant:
  max_tokens: {gemini: 4096, cerebras: 2400}   # 600 cut tables off mid-row
  max_tool_turns: 6              # model turns per question; the last one answers without tools
  max_retries: 1
  timeout_seconds: 30

# --- Live-data checker (scripts/predict_live.py --llm): one call per reviewed window
live_checker:
  max_tokens: {gemini: 2048, cerebras: 900}    # a JSON verdict with 3-5 sentences of reasoning
  max_retries: 1
  timeout_seconds: 45

# --- Audit log: data/runs/<run_id>/llm_calls.jsonl (prompt, response, usage, cost; never API keys)
