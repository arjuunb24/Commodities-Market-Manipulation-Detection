# Simulator volatility correction factors (written by scripts/calibrate_sim_volatility.py).
# vol_scale multiplies the sourced daily volatility INSIDE the simulator so that realised
# 5-minute volatility matches the sourced target. The sourced values are unchanged.
vol_scale:
  crude_oil_wti: 1.074
  brent_crude: 1.073
  gold: 1.025
  silver: 1.077
  natural_gas: 1.103
  copper: 1.012
  wheat: 0.969
  corn: 0.934
fit:
  horizon_ticks: 300
  seeds:
  - 7001
  - 7002
  - 7003
  ticks: 10000
  iterations: 1
  realised_over_target:
    crude_oil_wti:
      1min: 1.15
      5min: 0.967
      30min: 0.943
    brent_crude:
      1min: 1.137
      5min: 1.019
      30min: 0.956
    gold:
      1min: 1.06
      5min: 1.015
      30min: 0.961
    silver:
      1min: 1.239
      5min: 1.03
      30min: 0.97
    natural_gas:
      1min: 1.161
      5min: 0.977
      30min: 0.962
    copper:
      1min: 1.098
      5min: 0.994
      30min: 0.958
    wheat:
