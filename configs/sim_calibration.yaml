  crude_oil_wti: 1.027
  brent_crude: 1.01
  gold: 1.176
  silver: 0.834
  natural_gas: 1.131
  copper: 0.761
  wheat: 0.819
  corn: 0.655
fit:
  horizon_ticks: 300
  seeds:
  - 7001
  - 7002
  - 7003
  ticks: 10000
  iterations: 4
  realised_over_target:
