# =============================================================================
# configs/detector_config.yaml
#
# Hyperparameters for the two-layer manipulation detector (Module 2).
# Unit of detection: one (commodity, window, trader_id) row.
# =============================================================================

# --- Feature Engine ---
feature_engine:
  window: "3min"           # rolling window length (1 tick = 1 second)
  step: "30s"              # stride between windows
  top_k_traders: 5
  vol_spike_lookback: 10   # windows of history for volume / return baselines
  # Designated liquidity providers are surveilled under separate quoting rules;
  # their requote cancels would otherwise dominate every cancellation feature.
  exclude_trader_prefixes: ["mm_"]

# --- Unsupervised Layer: Isolation Forests ---
isolation_forest:
  contamination: 0.01         # trader-level flag rate (percentile threshold = 1 - contamination)
  market_contamination: 0.05  # market-regime forest (context feature only)
  n_estimators: 200
  max_samples: "auto"
  random_state: 42

# --- Supervised Layer: per-persona XGBoost ---
xgboost:
  n_estimators: 300
  max_depth: 4
  min_child_weight: 1
  n_estimators_small: 150
  max_depth_small: 3
  min_child_weight_small: 1
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  gamma: 0.5
  reg_alpha: 0.1
  reg_lambda: 2.0
  eval_metric: "logloss"
  max_scale_pos_weight: 50.0   # scale_pos_weight = n_neg / n_pos, capped
  random_state: 42

supervised:
  min_positives: 5             # fewer positive rows → classifier skipped with a warning
  require_all_personas: false  # true → raise InsufficientLabelsError instead (SRS FR-2.3 strict mode)
  cv_folds: 3                  # GroupKFold folds for out-of-fold threshold tuning
  cv_block_ticks: 600          # time-block size for CV groups (keeps overlapping windows together)
  threshold_bounds: [0.25, 0.9]  # tuned thresholds are kept inside this range (few-episode robustness)
  threshold_plateau_tol: 0.005   # thresholds within this (smoothed) OOF F1 of the best form the plateau; its centre is used
  threshold_keep_tol: 0.01       # on retrain, keep the previous threshold while its OOF F1 is within this of the best
  threshold_max_keep: 2          # ... but for at most this many retrains in a row, then re-tune
  # Negative subsampling: all positive rows are kept, a random share of negatives is used with weight
  # 1/fraction (unbiased class balance and F1). ~99% of the 2M+ cumulative rows are negatives; the 12
  # threshold-tuning fits took 572 s and the 4 final fits 249 s of the round-7 retrain (run seed888).
  cv_negative_fraction: 0.25     # threshold-tuning folds
  negative_fraction: 1.0         # final models
  subsample_min_rows: 50000      # smaller training sets are never subsampled

# --- Ensemble Scorer ---
ensemble:
  # "or_corroborated": flag if a classifier fires, OR the IsolationForest fires AND is
  # corroborated (a classifier >= min_prob_ratio of its threshold, or the account's
  # own-history deviation |self_z| >= min_self_z on at least min_self_z_cols features).
  # Uncorroborated forest flags become "review" items. "or": any forest flag is an alert.
  # Frozen-detector check (run 092237Z): 6.0 x 1 feature -> algo false alerts 6.3-7.4%;
  # 10.0 x 2 -> 1.4-1.5% with frozen coverage unchanged (round 1 spoofing 0.826 -> 0.818).
  # Re-tuned after the self-z scale floors and evidence weighting (run 131915Z_seed222): those cap
  # ratio deviations below ~7-9, so 10 x 2 almost never fired and a Sarao-style layering replay went
  # unalerted. 6 x 3 alerts it in every replay market AND cuts alerts on ordinary accounts
  # (round 4: 213 -> 135, round 7: 131 -> 29): agreement across three features filters noise better.
  combination_rule: "or_corroborated"
  iso_corroboration:
    min_prob_ratio: 0.5
    min_self_z: 6.0
    min_self_z_cols: 3
  iso_weight: 0.4              # used only if combination_rule = "weighted"
  supervised_weight: 0.6
  supervised_threshold: 0.5    # fallback when a threshold cannot be tuned
  top_shap_features: 5

# --- Personas to train classifiers for ---
personas:
  - spoofing
  - wash_trading
  - pump_and_dump
  - layering

# --- Continual learning across adversarial rounds ---
# Real-case replays (scripts/replay_cases.py) showed later rounds forgetting
# what the baseline round taught: the round-0 detector recognised a Sarao-style
# layering algorithm, rounds 2-5 did not. These options keep earlier patterns in view.
continual:
  # Tested on run 131915Z_seed222 (round 7): x3 and x6 did not restore the forgotten Sarao pattern
  # (layering probability 0.09 -> 0.09 / 0.05) and x6 hurt Coscia and Bases. Left off.
  anchor_round_weight: 1.0     # sample weight of round-0 training rows (1.0 = off)

# Documented real cases (configs/case_replays.yaml) added to EVERY retrain as
# extra labelled training markets (separate seeds from the test replays).
# Cases listed here are no longer a held-out test; keep the others held out.
# Cross-split test (run 131915Z_seed222): training on one group of cases lifted the right-label share
# on the OTHER, never-seen group (Deutsche Bank 51% -> 100%, Pacilio 70% -> 100%, Oystacher 73% -> 100%,
# Bases 31% -> 73%) with the run's own held-out metrics unchanged. Group A trains; group B stays held out.
replay_augmentation:
  cases: [coscia_panther, jpmorgan_precious_metals, merrill_bases_many_small, optiver_banging_the_close, shinhan_wash_trades]
  seeds: [101, 102, 103]
  ticks: 6000

# After each retrain, score these held-out replay cases and record recognition in
# round_N/replay_check.json; a warning is logged when a case stops being recognised.
replay_check:
  cases: [sarao_layering_algorithm, oystacher_3red, merrill_pacilio_single_large, deutsche_bank_vorley_chanu,
          amaranth_closing_range, moore_banging_the_close, cargill_position_transfers, tower_research_spoofing]
  seeds: [1, 2, 3]
  ticks: 6000

# --- Ground-truth labels ---
# activity: a window is positive only where the account placed manipulative orders (audit tags,
#           see ACTIVITY_TAGS in src/detector/pipeline.py); camouflage, decoys and quiet
#           accumulation are not labelled, so classifiers learn the manipulation, not the cover.
# span:     every window of the account overlapping its episode (the earlier definition).
labels:
  mode: activity

# --- Adversarial loop execution (speed only; results do not depend on these) ---
loop:
  feature_workers: 3      # round markets' features computed in parallel processes (~2 GB RAM each at 10,000 ticks)
  probe_workers: 8        # probe markets (all candidate sets) simulated + featurised in one pool
  replay_check_every: 2   # held-out replay check on round 0, every 2nd round and always the final round
