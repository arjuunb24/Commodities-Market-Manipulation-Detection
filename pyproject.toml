[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "veridex"
version = "0.1.0"
description = "Commodities Market Manipulation Detection via Agent-Based Simulation"
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "dashboard*", "scripts*"]

# =============================================================================
# Ruff — linting (replaces flake8 + isort + pyupgrade)
# =============================================================================
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "N",    # pep8-naming
    "ANN",  # flake8-annotations (type hint enforcement)
    "RUF",  # Ruff-specific rules
]
ignore = [
    "ANN101",  # self type annotation not required
    "ANN102",  # cls type annotation not required
    "ANN201",  # return type for public functions (too noisy for now)
    "E501",    # line too long — handled by formatter
]
exclude = ["notebooks/", "data/", ".venv/"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# =============================================================================
# mypy — strict type checking
# =============================================================================
[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["notebooks/", "data/", ".venv/", "tests/"]

# =============================================================================
# pytest
# =============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning:pandera",
    "ignore::FutureWarning:shap",
]

# =============================================================================
# black — code formatter
# =============================================================================
[tool.black]
line-length = 100
target-version = ["py311"]
exclude = '''
/(
    \.venv
    | data
    | notebooks
)/
'''
